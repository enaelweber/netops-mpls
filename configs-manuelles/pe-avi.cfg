username admin privilege 15 role network-admin secret sha512 $6$x7T3cc4rpBueYv4j$bc5Ngg9afwK4Xu8UrOBB3YsqJ4d30R2TGoCFR7JXSUJa8TsrtdR9lpdJSg.ri/XpDwY.opitMzYEQBBMNi2Fj1
!
management api http-commands
   no shutdown
!
no service interface inactive port-id allocation disabled
!
service routing protocols model multi-agent
!
hostname pe-avi
!
spanning-tree mode mstp
!
system l1
   unsupported speed action error
   unsupported error-correction action error
!
vrf instance TENANT_1
!
management api gnmi
   transport grpc default
!
management api netconf
   transport ssh default
!
interface Ethernet1
   description vers p2
   no switchport
   ip address 10.1.0.5/31
   ip ospf network point-to-point
   ip ospf area 0.0.0.0
!
interface Ethernet2
   description Filiale A ce-a-avi
   no switchport
   vrf TENANT_1
   ip address 172.16.1.2/31
   ip ospf network point-to-point
   ip ospf area 0.0.0.0
!
interface Loopback0
   ip address 10.0.0.4/32
   ip ospf area 0.0.0.0
!
interface Management0
   ip address 172.20.20.5/24
   ipv6 address 3fff:172:20:20::5/64
!
ip routing
ip routing vrf TENANT_1
!
ip route 0.0.0.0/0 172.20.20.1
!
ipv6 route ::/0 3fff:172:20:20::1
!
mpls ip
!
mpls ldp
   router-id interface Loopback0
   no shutdown
!
router bgp 65000
   router-id 10.0.0.4
   no bgp default ipv4-unicast
   neighbor 10.0.0.1 remote-as 65000
   neighbor 10.0.0.1 update-source Loopback0
   neighbor 10.0.0.1 description RR p1
   neighbor 10.0.0.1 send-community extended
   neighbor 10.0.0.1 maximum-routes 12000
   !
   address-family vpn-ipv4
      neighbor 10.0.0.1 activate
      neighbor default encapsulation mpls next-hop-self source-interface Loopback0
   !
   vrf TENANT_1
      rd 10.0.0.4:1
      route-target import vpn-ipv4 65000:1
      route-target export vpn-ipv4 65000:1
      neighbor 172.16.1.3 remote-as 65102
      neighbor 172.16.1.3 description ce-a-avi
      neighbor 172.16.1.3 maximum-routes 12000
      !
      address-family ipv4
         neighbor 172.16.1.3 activate
!
router ospf 1
   router-id 10.0.0.4
   passive-interface Loopback0
   max-lsa 12000
!
