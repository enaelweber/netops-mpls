! device: pe-par (cEOSLab, EOS-4.36.1F-48405728.4361F (engineering build))
!
no aaa root
!
username admin privilege 15 role network-admin secret sha512 $6$Qwr0RKh/dP5V.lLK$dn4w94mFlNQ/MmNPIXfrRaDP8s6LdT391X40NkAhqf3yxuaXoTms62EXp8qc76fuQvUquEy1r8lLBQZ2hDyP8.
!
management api http-commands
   no shutdown
!
no service interface inactive port-id allocation disabled
!
service routing protocols model multi-agent
!
hostname pe-par
!
spanning-tree mode mstp
!
system l1
   unsupported speed action error
   unsupported error-correction action error
!
vrf instance TENANT_1
!
vrf instance TENANT_2
!
management api gnmi
   transport grpc default
!
management api netconf
   transport ssh default
!
interface Ethernet1
   description pe-paris vers P1
   no switchport
   ip address 10.1.0.3/31
   ip ospf network point-to-point
   ip ospf area 0.0.0.0
!
interface Ethernet2
   description PE Paris vers CE A Paris
   no switchport
   vrf TENANT_1
   ip address 172.16.1.0/31
   ip ospf network point-to-point
   ip ospf area 0.0.0.0
!
interface Ethernet3
   description PE Paris vers CE B Paris
   no switchport
   vrf TENANT_2
   ip address 172.16.2.0/31
   ip ospf network point-to-point
   ip ospf area 0.0.0.0
!
interface Loopback0
   ip address 10.0.0.3/32
   ip ospf area 0.0.0.0
!
interface Management0
   ip address 172.20.20.6/24
   ipv6 address 3fff:172:20:20::6/64
!
ip routing
ip routing vrf TENANT_1
ip routing vrf TENANT_2
!
ip route 0.0.0.0/0 172.20.20.1
!
ipv6 route ::/0 3fff:172:20:20::1
!
mpls ip
!
mpls ldp
   router-id interface Loopback0
   no shutdown
!
router bgp 65000
   router-id 10.0.0.3
   no bgp default ipv4-unicast
   neighbor 10.0.0.1 remote-as 65000
   neighbor 10.0.0.1 update-source Loopback0
   neighbor 10.0.0.1 description RR p1
   neighbor 10.0.0.1 send-community extended
   neighbor 10.0.0.1 maximum-routes 12000
   !
   address-family vpn-ipv4
      neighbor 10.0.0.1 activate
      neighbor default encapsulation mpls next-hop-self source-interface Loopback0
   !
   vrf TENANT_1
      rd 10.0.0.3:1
      route-target import vpn-ipv4 65000:1
      route-target export vpn-ipv4 65000:1
      neighbor 172.16.1.1 remote-as 65101
      neighbor 172.16.1.1 description ce-a-par
      neighbor 172.16.1.1 maximum-routes 12000
      !
      address-family ipv4
         neighbor 172.16.1.1 activate
   !
   vrf TENANT_2
      rd 10.0.0.3:2
      route-target import vpn-ipv4 65000:2
      route-target export vpn-ipv4 65000:2
      neighbor 172.16.2.1 remote-as 65201
      neighbor 172.16.2.1 description ce-b-par
      neighbor 172.16.2.1 maximum-routes 12000
      !
      address-family ipv4
         neighbor 172.16.2.1 activate
!
router ospf 1
   router-id 10.0.0.3
   passive-interface Loopback0
   max-lsa 12000
!
end
